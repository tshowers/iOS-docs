name: DocsIOS
options:
  minimumXcodeGenVersion: 2.38.0
configs:
  Debug: debug
  Release: release
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: tech.taliferro.docsios
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    SWIFT_VERSION: 5.0
packages:
  FirebaseiOS:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.29.0
  TODDAuthKit:
    path: ../TODDAuthKit
  TODDEntitlementKit:
    path: ../TODDEntitlementKit
targets:
  DocsIOS:
    type: application
    platform: iOS
    sources:
      - path: DocsIOS
    settings:
      base:
        PRODUCT_NAME: DocsIOS
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DOCS_API_BASE_URL: https://api.taliferro.tech/api
        # Set once Docs' subscription product exists in App Store Connect
        # (see docs/app-store-exclusive-billing-plan.md) - empty is expected
        # until then; EntitlementService treats it as "not configured yet".
        DOCS_APP_STORE_PRODUCT_ID: ""
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Docs
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        DOCS_API_BASE_URL: $(DOCS_API_BASE_URL)
        DOCS_APP_STORE_PRODUCT_ID: $(DOCS_APP_STORE_PRODUCT_ID)
        # Native Google Sign-In's redirect callback scheme - the
        # REVERSED_CLIENT_ID from GoogleService-Info.plist, caught by
        # GoogleSignInHelper.handle(url) via .onOpenURL in DocsIOSApp.swift.
        # Mirrors network-ios/pulse-ios.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.633736143723-ruepm29blciopimbf85h4vssm7t745k0
    entitlements:
      path: DocsIOS.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - package: FirebaseiOS
        product: FirebaseAuth
      - package: FirebaseiOS
        product: FirebaseFirestore
      - package: TODDAuthKit
      - package: TODDEntitlementKit
    scheme:
      testTargets: []

name: DocsIOS
options:
  minimumXcodeGenVersion: 2.38.0
configs:
  Debug: debug
  Release: release
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: tech.taliferro.docsios
    # Real device builds need a real team for the Associated Domains
    # capability (Universal Links) to actually provision - matches
    # taliferro-music-native's team.
    DEVELOPMENT_TEAM: "6377FLHLAG"
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    SWIFT_VERSION: 5.0
packages:
  FirebaseiOS:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 10.29.0
  TODDAuthKit:
    path: ../TODDAuthKit
  TODDEntitlementKit:
    path: ../TODDEntitlementKit
  TODDProfileKit:
    path: ../TODDProfileKit
  TODDAwardsKit:
    path: ../TODDAwardsKit
targets:
  DocsIOS:
    type: application
    platform: iOS
    sources:
      - path: DocsIOS
    settings:
      base:
        PRODUCT_NAME: DocsIOS
        # App Store version (MARKETING_VERSION) and build number
        # (CURRENT_PROJECT_VERSION). Bump the build number for every upload
        # to App Store Connect - it must be higher than the last one.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DOCS_API_BASE_URL: https://api.taliferro.tech/api
        # The "TODD Docs" monthly subscription in App Store Connect
        # (group TODD-Docs).
        DOCS_APP_STORE_PRODUCT_ID: ToddDocs10001
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Docs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Only standard HTTPS (exempt) - declaring it here means App Store
        # Connect never holds a build for the export compliance question.
        ITSAppUsesNonExemptEncryption: false
        # Required for Face ID - without it iOS can refuse the biometric
        # check and the unlock screen never completes.
        NSFaceIDUsageDescription: Docs uses Face ID to keep your documents private when you open the app.
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # Required for App Store validation: TARGETED_DEVICE_FAMILY is 1,2,
        # and iPad multitasking needs all four orientations declared.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        DOCS_API_BASE_URL: $(DOCS_API_BASE_URL)
        DOCS_APP_STORE_PRODUCT_ID: $(DOCS_APP_STORE_PRODUCT_ID)
        # Native Google Sign-In's redirect callback scheme - the
        # REVERSED_CLIENT_ID from GoogleService-Info.plist, caught by
        # GoogleSignInHelper.handle(url) via .onOpenURL in DocsIOSApp.swift.
        # Mirrors network-ios/pulse-ios.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - com.googleusercontent.apps.633736143723-ruepm29blciopimbf85h4vssm7t745k0
    entitlements:
      path: DocsIOS.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        # Universal Links: see network-ios's project.yml for the full
        # explanation - same mechanism, this app's own domain.
        com.apple.developer.associated-domains:
          - applinks:docs.taliferro.tech
    dependencies:
      - package: FirebaseiOS
        product: FirebaseAuth
      - package: FirebaseiOS
        product: FirebaseFirestore
      - package: TODDAuthKit
      - package: TODDEntitlementKit
      - package: TODDProfileKit
      - package: TODDAwardsKit
    scheme:
      testTargets: []
